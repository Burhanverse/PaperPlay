[package]
name = "usb_audio"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "usb_audio"
crate-type = ["cdylib", "rlib"]

[features]
default = []
dev = []

[dependencies]
jni = { version = "0.21", default-features = false }
rusb = "0.9"
libusb1-sys = { version = "0.7", default-features = false }
libc = "0.2"
